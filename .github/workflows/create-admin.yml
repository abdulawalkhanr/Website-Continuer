name: Create Admin Account

on:
  workflow_dispatch:

jobs:
  create-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create administrator account
        working-directory: lib/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          import { randomBytes, scryptSync } from "node:crypto";

          const { Pool } = pg;
          const email = "admin@circonsultationservice.site";
          const password = process.env.ADMIN_INITIAL_PASSWORD;

          if (!process.env.DATABASE_URL || !password || password.length < 12) {
            throw new Error("Required GitHub secrets are missing.");
          }

          const salt = randomBytes(16);
          const hash = scryptSync(password, salt, 32, {
            N: 16384,
            r: 8,
            p: 1,
            maxmem: 64 * 1024 * 1024
          });

          const passwordHash =
            `scrypt$16384$8$1$${salt.toString("hex")}$${hash.toString("hex")}`;

          const url = new URL(process.env.DATABASE_URL);
          url.searchParams.delete("sslmode");
          const pool = new Pool({
            connectionString: url.toString(),
            connectionTimeoutMillis: 10000,
            ssl: { rejectUnauthorized: true, ...(process.env.DATABASE_SSL_CA ? { ca: process.env.DATABASE_SSL_CA.replace(/\\n/g, "\n") } : {}) }
          });

          try {
            await pool.query(
              `INSERT INTO public.users
                 (name, email, password_hash, role)
               VALUES ($1, $2, $3, 'OWNER')
               ON CONFLICT (email) DO NOTHING`,
              ["CIR Administrator", email, passwordHash]
            );

            console.log("Create-only administrator setup completed. Existing accounts were not changed.");
          } finally {
            await pool.end();
          }
          NODE
