name: Initialize Supabase Database

on:
  workflow_dispatch:

jobs:
  initialize-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create missing tables without modifying users
        working-directory: lib/db
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          import { readFile } from "node:fs/promises";
          const { Pool } = pg;
          const url = new URL(process.env.DATABASE_URL);
          url.searchParams.delete("sslmode");
          const pool = new Pool({
            connectionString: url.toString(),
            connectionTimeoutMillis: 10000,
            ssl: { rejectUnauthorized: true, ...(process.env.DATABASE_SSL_CA ? { ca: process.env.DATABASE_SSL_CA.replace(/\\n/g, "\n") } : {}) }
          });
          try {
            await pool.query(await readFile("../../deployment/supabase-missing-schema.sql", "utf8"));
            console.log("Create-only schema script completed. Existing users were not modified.");
          } finally {
            await pool.end();
          }
          NODE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
