<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}
.ad{width:100vw;height:100vh;background:#0F172A;display:flex;flex-direction:column;justify-content:space-between;padding:6vh 7vw}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:1.2vw}
.logo-badge{background:#A7D8FF;border-radius:0.8vw;padding:0.5vh 1.2vw;font-family:'Poppins',sans-serif;font-weight:900;font-size:2.2vw;color:#0F172A}
.logo-text{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.4vw;color:rgba(255,255,255,0.55)}
.slide-num{font-family:'Poppins',sans-serif;font-size:1.4vw;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.08);padding:0.4vh 1.2vw;border-radius:2vw}
.middle{display:flex;flex-direction:column;gap:3vh}
.eyebrow{font-family:'Poppins',sans-serif;font-size:2vw;font-weight:600;color:#FFD6E8;letter-spacing:0.08em;text-transform:uppercase}
.headline{font-family:'Poppins',sans-serif;font-size:7vw;font-weight:900;line-height:1.05;color:#FFFFFF}
.headline span{color:#FFD6E8}
.ctas{display:flex;flex-direction:column;gap:1.5vh}
.cta-wa{display:inline-flex;align-items:center;gap:1.5vw;background:#25D366;color:#FFFFFF;font-family:'Poppins',sans-serif;font-weight:700;font-size:2.4vw;padding:1.8vh 4vw;border-radius:0.8vw;align-self:flex-start}
.cta-call{display:inline-flex;align-items:center;gap:1.5vw;background:rgba(255,255,255,0.1);color:#FFFFFF;font-family:'Poppins',sans-serif;font-weight:600;font-size:2vw;padding:1.4vh 4vw;border-radius:0.8vw;align-self:flex-start;border:1px solid rgba(255,255,255,0.2)}
.footer{font-family:'Poppins',sans-serif;font-size:1.6vw;color:rgba(255,255,255,0.35)}
</style>
</head>
<body>
<div class="ad">
  <div class="top">
    <div class="logo">
      <div class="logo-badge">CIR</div>
      <div class="logo-text">Consultation Service</div>
    </div>
    <div class="slide-num">5 / 5</div>
  </div>
  <div class="middle">
    <div class="eyebrow">Free Consultation</div>
    <div class="headline">Start Your<br><span>Recovery</span><br>Today</div>
    <div class="ctas">
      <div class="cta-wa">📱 WhatsApp: +91 98649 20810</div>
      <div class="cta-call">📞 Call: 011-69310902</div>
    </div>
  </div>
  <span class="footer">circonsultationservice.in &nbsp;·&nbsp; Your Partner in Financial Health</span>
</div>
</body>
</html>
