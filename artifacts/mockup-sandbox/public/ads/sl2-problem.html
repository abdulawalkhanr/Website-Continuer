<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}
.ad{width:100vw;height:100vh;background:#2D0A0A;display:flex;flex-direction:column;justify-content:space-between;padding:6vh 7vw}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:1.2vw}
.logo-badge{background:#FFD6E8;border-radius:0.8vw;padding:0.5vh 1.2vw;font-family:'Poppins',sans-serif;font-weight:900;font-size:2.2vw;color:#2D0A0A}
.logo-text{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.4vw;color:rgba(255,255,255,0.55)}
.slide-num{font-family:'Poppins',sans-serif;font-size:1.4vw;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.08);padding:0.4vh 1.2vw;border-radius:2vw}
.middle{display:flex;flex-direction:column;gap:2.5vh}
.eyebrow{font-family:'Poppins',sans-serif;font-size:2vw;font-weight:600;color:#FFD6E8;letter-spacing:0.08em;text-transform:uppercase}
.headline{font-family:'Poppins',sans-serif;font-size:7.5vw;font-weight:900;line-height:1.05;color:#FFFFFF}
.headline span{color:#FFD6E8}
.benefit{font-family:'Lora',serif;font-size:2.3vw;color:rgba(255,255,255,0.6);line-height:1.4;font-style:italic}
.swipe{font-family:'Poppins',sans-serif;font-size:1.8vw;color:rgba(255,255,255,0.4);letter-spacing:0.04em}
</style>
</head>
<body>
<div class="ad">
  <div class="top">
    <div class="logo">
      <div class="logo-badge">CIR</div>
      <div class="logo-text">Consultation Service</div>
    </div>
    <div class="slide-num">2 / 5</div>
  </div>
  <div class="middle">
    <div class="eyebrow">The Problem</div>
    <div class="headline">Loans<br>Rejected.<br><span>High Interest.</span></div>
    <div class="benefit">A bad CIBIL score blocks your financial freedom.</div>
  </div>
  <span class="swipe">Swipe → for the solution</span>
</div>
</body>
</html>
