<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}
.ad{width:100vw;height:100vh;background:#1A0A2E;display:flex;flex-direction:column;justify-content:space-between;padding:6vh 7vw}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:1.2vw}
.logo-badge{background:#DCC6FF;border-radius:0.8vw;padding:0.5vh 1.2vw;font-family:'Poppins',sans-serif;font-weight:900;font-size:2.2vw;color:#1A0A2E}
.logo-text{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.4vw;color:rgba(255,255,255,0.55)}
.slide-num{font-family:'Poppins',sans-serif;font-size:1.4vw;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.08);padding:0.4vh 1.2vw;border-radius:2vw}
.middle{display:flex;flex-direction:column;gap:2.5vh}
.eyebrow{font-family:'Poppins',sans-serif;font-size:2vw;font-weight:600;color:#DCC6FF;letter-spacing:0.08em;text-transform:uppercase}
.headline{font-family:'Poppins',sans-serif;font-size:6.5vw;font-weight:900;line-height:1.1;color:#FFFFFF}
.headline span{color:#DCC6FF}
.services{display:flex;flex-direction:column;gap:1.2vh;margin-top:0.5vh}
.svc{font-family:'Poppins',sans-serif;font-size:2vw;color:rgba(255,255,255,0.75);display:flex;align-items:center;gap:1vw}
.dot{width:0.7vw;height:0.7vw;border-radius:50%;background:#DCC6FF;flex-shrink:0}
.swipe{font-family:'Poppins',sans-serif;font-size:1.8vw;color:rgba(255,255,255,0.4);letter-spacing:0.04em}
</style>
</head>
<body>
<div class="ad">
  <div class="top">
    <div class="logo">
      <div class="logo-badge">CIR</div>
      <div class="logo-text">Consultation Service</div>
    </div>
    <div class="slide-num">4 / 5</div>
  </div>
  <div class="middle">
    <div class="eyebrow">What We Do</div>
    <div class="headline">Complete<br><span>Financial</span><br>Solutions</div>
    <div class="services">
      <div class="svc"><div class="dot"></div>CIBIL Score Rectification</div>
      <div class="svc"><div class="dot"></div>Written-Off Account Disputes</div>
      <div class="svc"><div class="dot"></div>GST &amp; ITR Filing</div>
      <div class="svc"><div class="dot"></div>Business &amp; MSME Registration</div>
    </div>
  </div>
  <span class="swipe">Swipe → for free consultation</span>
</div>
</body>
</html>
