<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}
.ad{width:100vw;height:100vh;background:#0F172A;display:flex;flex-direction:column;justify-content:space-between;padding:6vh 7vw}
.logo{display:flex;align-items:center;gap:1.2vw}
.logo-badge{background:#A7D8FF;border-radius:0.8vw;padding:0.6vh 1.2vw;font-family:'Poppins',sans-serif;font-weight:900;font-size:2.5vw;color:#0F172A;letter-spacing:0.05em}
.logo-text{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.5vw;color:rgba(255,255,255,0.6);letter-spacing:0.02em}
.middle{display:flex;flex-direction:column;gap:3vh}
.headline{font-family:'Poppins',sans-serif;font-size:8.5vw;font-weight:900;line-height:1.05;color:#FFFFFF;letter-spacing:-0.02em}
.headline span{color:#FFD6E8}
.benefit{font-family:'Lora',serif;font-size:2.4vw;color:rgba(255,255,255,0.65);line-height:1.4}
.cta{display:inline-block;background:#FFD6E8;color:#0F172A;font-family:'Poppins',sans-serif;font-weight:700;font-size:2.2vw;padding:1.8vh 5vw;border-radius:0.8vw;align-self:flex-start;letter-spacing:0.02em}
.footer{font-family:'Poppins',sans-serif;font-size:1.6vw;color:rgba(255,255,255,0.35);letter-spacing:0.05em}
</style>
</head>
<body>
<div class="ad">
  <div class="logo">
    <div class="logo-badge">CIR</div>
    <div class="logo-text">Consultation Service</div>
  </div>
  <div class="middle">
    <div class="headline">Loan<br>Rejected<br><span>Again?</span></div>
    <div class="benefit">We fix your CIBIL score &amp; disputes fast.</div>
    <div class="cta">WhatsApp Us Now</div>
  </div>
  <span class="footer">circonsultationservice.in &nbsp;·&nbsp; +91 98649 20810</span>
</div>
</body>
</html>
