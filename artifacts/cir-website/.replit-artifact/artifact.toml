kind = "web"
previewPath = "/"
title = "CIR Consultation Service"
version = "1.0.0"
id = "artifacts/cir-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25586

[services.development]
run = "pnpm --filter @workspace/cir-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cir-website", "run", "build" ]
publicDir = "artifacts/cir-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25586"
BASE_PATH = "/"
